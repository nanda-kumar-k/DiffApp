<!-- templates/base.html -->
<!DOCTYPE html>
<html lang="en" data-bs-theme="light" data-ag-theme-mode="light">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>{% block title %}JSON Diff App{% endblock %}</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href={{ url_for('static', filename='css/basic.css') }} rel="stylesheet" />
    {% block head %}{% endblock %}
</head>

<body>
    <!-- Fixed-top Navbar -->
    <nav class="navbar bg-body-tertiary shadow-sm fixed-top">
        <div class="container-fluid">
            <!-- “Nanda” on the left -->
            <a class="navbar-brand" href="#">Diff App</a>
            <!-- Right-aligned links -->
            <ul class="navbar-nav flex-row gap-2">
                <li class="nav-item">
                    <button onclick="toggleSidebarClick('json')" class="btn btn-outline-none nav-btn" type="button">
                        JSON Compare
                    </button>
                </li>
                <li class="nav-item">
                    <button onclick="toggleSidebarClick('spreadsheet')" class="btn btn-outline-none nav-btn" type="button">
                        Spreadsheet Compare
                    </button>
                </li>
                <li class="nav-item">
                    <button id="themeToggle"
                        class="btn btn-outline-secondary border-0"
                        type="button"
                        aria-label="Toggle colour mode"
                    >
                            <i id="themeIcon" class="bi bi-moon-stars"></i>
                    </button>
                </li>

            </ul>   
        </div>
    </nav>

    <!-- Persistent Sidebar -->
    <div id="sidebar" >
        <div class="sidebar-header">
            <h5>Menu</h5>
            <!-- Close icon -->
            <span id="closeSidebarBtn" class="sidebar-close">&times;</span>
        </div>
    </div>

    <!-- Main content area; will shift right when sidebar is shown -->
    <div class="content-wrapper">
        <div class="container-fluid" style="height: calc(100vh - 56px - 2rem)">
            {% block content %}{% endblock %}
        </div>
    </div>
    <script>
        window.CURRENT_ENDPOINT = "{{ request.endpoint }}";
    </script>
    <!-- Bootstrap JS Bundle (with Popper) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/ag-charts-enterprise@11.1.0/dist/umd/ag-charts-enterprise.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/ag-grid-enterprise@34.0.0/dist/ag-grid-enterprise.min.js"></script>
    <script src="{{ url_for('static', filename='js/basic.js') }}"></script>
    

    {% block scripts %}{% endblock %}
</body>

</html>
