{% extends "base.html" %}
{% block title %}View JSONs{% endblock %}

{% block head %}
<style>
    .json-card {
        border: 1px solid #dee2e6;
        border-radius: 5px;
        margin-bottom: 1rem;
        display: flex;
        flex-direction: column;
        /* Removed height:100% to prevent flex from stretching all cards */
    }

    .json-card-header {
        padding: 0.75rem 1rem;
        background-color: #f8f9fa;
        border-bottom: 1px solid #dee2e6;
        border-top-left-radius: 5px;
        border-top-right-radius: 5px;
        font-size: 1rem;
        font-weight: 500;
    }

    .json-card-body {
        flex-grow: 1;
        max-height: 60vh;
        overflow-y: auto;
        padding: 1rem;
        background-color: #ffffff;
        white-space: pre-wrap;
        word-wrap: break-word;
        font-family: Menlo, Monaco, Consolas, "Courier New", monospace;
        font-size: 0.9rem;
        transition: max-height 0.3s ease;
    }

    .json-card-body.expanded {
        max-height: none;
    }

    .json-card-footer {
        padding: 0.5rem 1rem;
        background-color: #f8f9fa;
        border-top: 1px solid #dee2e6;
        border-bottom-left-radius: 5px;
        border-bottom-right-radius: 5px;
        text-align: center;
    }

    .toggle-btn {
        background: none;
        border: none;
        color: #0d6efd;
        font-size: 0.9rem;
        cursor: pointer;
        padding: 0;
    }

    .toggle-btn:hover {
        text-decoration: underline;
    }
</style>
{% endblock %}

{% block content %}
<div class="row h-100">
    <!-- First JSON Card -->
    <div class="col-md-6 mb-4">
        <div class="json-card">
            <div class="json-card-header">First JSON</div>
            <div id="bodyFirst" class="json-card-body">{{ json1 }}</div>
            <div class="json-card-footer">
                <button id="toggleFirst" class="toggle-btn">View More</button>
            </div>
        </div>
    </div>

    <!-- Second JSON Card -->
    <div class="col-md-6 mb-4">
        <div class="json-card">
            <div class="json-card-header">Second JSON</div>
            <div id="bodySecond" class="json-card-body">{{ json2 }}</div>
            <div class="json-card-footer">
                <button id="toggleSecond" class="toggle-btn">View More</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.addEventListener("DOMContentLoaded", function () {
        // Helper to initialize one card's toggle behavior
        function setupCardToggle(btnId, bodyId) {
            const btn = document.getElementById(btnId);
            const body = document.getElementById(bodyId);

            // Compute 60vh in pixels for comparison
            const maxHeightPx = window.innerHeight * 0.60;

            // After a short delay (to let the <pre> render), hide button if not needed
            setTimeout(() => {
                if (body.scrollHeight <= maxHeightPx) {
                    btn.style.display = "none";
                }
            }, 50);

            let expanded = false;
            btn.addEventListener("click", function () {
                if (!expanded) {
                    body.classList.add("expanded");
                    btn.textContent = "View Less";
                } else {
                    body.classList.remove("expanded");
                    btn.textContent = "View More";
                }
                expanded = !expanded;
            });
        }

        setupCardToggle("toggleFirst", "bodyFirst");
        setupCardToggle("toggleSecond", "bodySecond");
    });
</script>
{% endblock %}
