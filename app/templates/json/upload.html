{% extends "base.html" %}
{% block title %}Upload JSON Files{% endblock %}

{% block content %}
  <div class="d-flex h-100 justify-content-center align-items-center">
    <div class="col-10 col-sm-8 col-md-6 col-lg-4">
      <h2 class="text-center mb-4">Upload Two JSON Files</h2>

      {% if error %}
        <div class="alert alert-danger text-center">{{ error }}</div>
      {% endif %}

      <form method="POST" enctype="multipart/form-data">
        <div class="mb-3">
          <label for="json1" class="form-label">First JSON</label>
          <input
            class="form-control"
            type="file"
            id="json1"
            name="json1"
            accept=".json"
            required
          />
        </div>
        <div class="mb-3">
          <label for="json2" class="form-label">Second JSON</label>
          <input
            class="form-control"
            type="file"
            id="json2"
            name="json2"
            accept=".json"
            required
          />
        </div>
        <div class="d-grid mt-4">
          <button type="submit" class="btn btn-primary">Upload &amp; Continue</button>
        </div>
      </form>
    </div>
  </div>
{% endblock %}
